name: Release baseline gates

on:
  pull_request:
  push:
    branches: [main, feat/platform-release-baseline]

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm runtime:contract
      - run: shellcheck -x scripts/acme-renewal.test.sh scripts/vps-preview.sh scripts/vps-preview-lib.sh scripts/vps-preview-remote.sh scripts/*vps-preview*.test.sh
      - run: pnpm test:vps-preview
      - run: bash scripts/vps-preview-failure-matrix.test.sh
      - run: pnpm test:docker-dry-run
      - run: pnpm ci:vitest:forbid-only
      - run: pnpm --filter @deploylite/contracts --filter @deploylite/config --filter @deploylite/domain --filter @deploylite/agent --filter @deploylite/db build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: deploylite
          POSTGRES_USER: deploylite
          POSTGRES_PASSWORD: deploylite-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deploylite -d deploylite" --health-interval 5s --health-timeout 5s --health-retries 20
          --label io.deploylite.ci.owner=${{ github.repository }}
          --label io.deploylite.ci.run=${{ github.run_id }}
          --label io.deploylite.ci.attempt=${{ github.run_attempt }}
          --label io.deploylite.ci.job=postgres-integration
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24.20.0, cache: pnpm }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter @deploylite/db db:migrate
        env: { DATABASE_URL: postgres://deploylite:deploylite-ci-only@localhost:5432/deploylite }
      - name: Test PostgreSQL CI helper without runtime effects
        run: python3 scripts/ci/postgres-restart.test.py
      - name: Capture current hosted job and source evidence binding
        env:
          DEPLOYLITE_PG_CONTAINER_ID: ${{ job.services.postgres.id }}
          DEPLOYLITE_PG_IMAGE: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          DEPLOYLITE_PG_RECEIPT_DIR: ${{ runner.temp }}/deploylite-postgres-evidence
        run: python3 scripts/ci/postgres-restart.py capture
      - name: Verify DB integration including the owned physical restart
        id: db_tests
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/deploylite-postgres-evidence"
          pnpm --filter @deploylite/db db:verify:integration --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/deploylite-postgres-evidence/db.json" 2>&1 | tee "$RUNNER_TEMP/deploylite-postgres-evidence/db.log"
        env:
          DATABASE_URL: postgres://deploylite:deploylite-ci-only@localhost:5432/deploylite
          DEPLOYLITE_PG_RESTART_HELPER: ${{ github.workspace }}/scripts/ci/postgres-restart.py
          DEPLOYLITE_PG_CONTAINER_ID: ${{ job.services.postgres.id }}
          DEPLOYLITE_PG_IMAGE: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          DEPLOYLITE_PG_RECEIPT_DIR: ${{ runner.temp }}/deploylite-postgres-evidence
      - name: Verify API PostgreSQL integration
        if: ${{ !cancelled() && steps.db_tests.outcome != 'skipped' }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/deploylite-postgres-evidence"
          pnpm --filter @deploylite/api db:verify:integration --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/deploylite-postgres-evidence/api.json" 2>&1 | tee "$RUNNER_TEMP/deploylite-postgres-evidence/api.log"
        env: { DATABASE_URL: postgres://deploylite:deploylite-ci-only@localhost:5432/deploylite }
      - name: Verify P3 Compose atomic persistence on the same disposable PostgreSQL service
        if: ${{ !cancelled() && steps.db_tests.outcome != 'skipped' }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/deploylite-postgres-evidence"
          pnpm --filter @deploylite/db db:verify:compose --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/deploylite-postgres-evidence/p3-compose-db.json" 2>&1 | tee "$RUNNER_TEMP/deploylite-postgres-evidence/p3-compose-db.log"
        env: { DATABASE_URL: postgres://deploylite:deploylite-ci-only@localhost:5432/deploylite }
      - name: Verify suite fixture cleanup on the exact CI service
        if: always()
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          python3 - <<'PY'
          import os, runpy
          helper = runpy.run_path("scripts/ci/postgres-restart.py")
          helper["cleanup"](os.environ["PG_SERVICE_ID"])
          PY
      - name: Require complete physical restart and suite evidence
        if: always()
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          python3 - <<'PY'
          import json, os, runpy, sys
          from pathlib import Path
          helper = runpy.run_path("scripts/ci/postgres-restart.py")
          helper["complete_binding"](Path(os.environ["RUNNER_TEMP"]) / "deploylite-postgres-evidence", os.environ["PG_SERVICE_ID"])
          verified = helper["verify_evidence"](Path(os.environ["RUNNER_TEMP"]) / "deploylite-postgres-evidence", os.environ["PG_SERVICE_ID"])
          print(json.dumps({"status": "verified" if verified else "not_verified"}))
          sys.exit(0 if verified else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: postgres-integration-reports
          path: ${{ runner.temp }}/deploylite-postgres-evidence/
          if-no-files-found: warn
          retention-days: 30

  compose-and-supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      api_digest: ${{ steps.images.outputs.api_digest }}
      web_digest: ${{ steps.images.outputs.web_digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24.20.0, cache: pnpm }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm ci:evidence:check && bash scripts/compose.test.sh
      - run: pnpm test:acme-renewal
      - run: pnpm test:migration-image
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.28.0
        with: { scan-type: fs, scan-ref: ., severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: "false" }
      - run: docker build --file apps/api/Dockerfile --tag deploylite-api:ci . && docker build --file apps/web/Dockerfile --tag deploylite-web:ci .
        if: always()
      - id: images
        if: always()
        run: |
          printf 'api_digest=%s\n' "$(docker inspect --type=image deploylite-api:ci | jq -er '.[0].Id')" >> "$GITHUB_OUTPUT"
          printf 'web_digest=%s\n' "$(docker inspect --type=image deploylite-web:ci | jq -er '.[0].Id')" >> "$GITHUB_OUTPUT"
      - name: Generate API image SBOM
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.28.0
        with: { scan-type: image, image-ref: deploylite-api:ci, format: cyclonedx, output: api.sbom.json, scanners: vuln }
      - name: Generate web image SBOM
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.28.0
        with: { scan-type: image, image-ref: deploylite-web:ci, format: cyclonedx, output: web.sbom.json, scanners: vuln }
      - id: api_image_trivy_scan
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.28.0
        continue-on-error: true
        with: { scan-type: image, image-ref: deploylite-api:ci, format: json, output: api.trivy.json, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: "false" }
      - id: web_image_trivy_scan
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.28.0
        continue-on-error: true
        with: { scan-type: image, image-ref: deploylite-web:ci, format: json, output: web.trivy.json, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: "false" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: supply-chain-reports
          path: |
            api.sbom.json
            web.sbom.json
            api.trivy.json
            web.trivy.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify image vulnerability scans passed
        if: always()
        run: |
          set -Eeuo pipefail
          test "${{ steps.api_image_trivy_scan.outcome }}" = success
          test "${{ steps.web_image_trivy_scan.outcome }}" = success

  # SOURCE PROPOSAL ONLY: a future exact user-approved CI publication/run must
  # cover these owned operations/resources. Generated JSON is not authorization.
  p2-docker-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEPLOYLITE_DOCKER_RUNTIME_GRANT: P2_PHYSICAL_DOCKER_APPROVED
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24.20.0, cache: pnpm }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Test preparation and evidence guards with fake processes only
        run: python3 scripts/ci/p2-physical-acceptance.test.py
      - name: Prepare owned native pinned fixtures
        id: prepare
        env:
          DEPLOYLITE_DOCKER_RUNTIME_GRANT: P2_PHYSICAL_DOCKER_APPROVED
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_CONFIG: ${{ runner.temp }}/deploylite-p2-empty-docker-config
          DEPLOYLITE_DOCKER_PREPARATION_ROOT: ${{ runner.temp }}/deploylite-p2-docker-evidence
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/p2-physical-acceptance.py prepare
          cat "$RUNNER_TEMP/deploylite-p2-docker-evidence/environment.env" >> "$GITHUB_ENV"
      - name: Execute exact Docker receiver and API acceptance source
        id: cases
        env:
          DEPLOYLITE_DOCKER_INTEGRATION: '1'
          DEPLOYLITE_DOCKER_RUNTIME_GRANT: P2_PHYSICAL_DOCKER_APPROVED
          DEPLOYLITE_DB_INTEGRATION: '0'
          DEPLOYLITE_API_DB_INTEGRATION: '0'
        run: |
          set -Eeuo pipefail
          pnpm --filter @deploylite/api run test src/deployment-docker.integration.test.ts --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/deploylite-p2-docker-evidence/docker.json" 2>&1 | tee "$RUNNER_TEMP/deploylite-p2-docker-evidence/docker.log"
      - name: Verify or close only recorded owned fixture resources
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/deploylite-p2-empty-docker-config
          DEPLOYLITE_DOCKER_RUNTIME_GRANT: P2_PHYSICAL_DOCKER_APPROVED
          DEPLOYLITE_DOCKER_PREPARATION_ROOT: ${{ runner.temp }}/deploylite-p2-docker-evidence
        run: python3 scripts/ci/p2-physical-acceptance.py cleanup
      - name: Require exact case and physical evidence with no skips
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/deploylite-p2-empty-docker-config
          DEPLOYLITE_DOCKER_PREPARATION_ROOT: ${{ runner.temp }}/deploylite-p2-docker-evidence
        run: python3 scripts/ci/p2-physical-acceptance.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: p2-docker-acceptance-reports
          path: ${{ runner.temp }}/deploylite-p2-docker-evidence/
          if-no-files-found: error
          retention-days: 30

  # Same-repository candidate PR only; disposable GitHub-hosted engine, exact head SHA, no secrets.
  p3-docker-acceptance:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'DeployLiteApp/DeployLite' && github.event.pull_request.head.repo.full_name == 'DeployLiteApp/DeployLite' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'feat/p3-resources-candidate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEPLOYLITE_P3_DOCKER_RUNTIME_GRANT: P3_COMPOSE_CI_APPROVED
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_CONFIG: ${{ runner.temp }}/deploylite-p3-empty-docker-config
      DEPLOYLITE_P3_FIXTURE_MANIFEST: ${{ runner.temp }}/deploylite-p3-fixture-manifest.json
      DEPLOYLITE_P3_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      DEPLOYLITE_P3_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      RUNNER_ENVIRONMENT: ${{ runner.environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24.20.0, cache: pnpm }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Test hosted-job and source gates without Docker effects
        run: python3 scripts/ci/p3-compose-physical-acceptance.test.py
      - name: Prepare one pinned, owned fixture image then remove the registry
        env:
          DEPLOYLITE_P3_DOCKER_RUNTIME_GRANT: P3_COMPOSE_CI_APPROVED
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_CONFIG: ${{ runner.temp }}/deploylite-p3-empty-docker-config
          DEPLOYLITE_P3_FIXTURE_MANIFEST: ${{ runner.temp }}/deploylite-p3-fixture-manifest.json
          DEPLOYLITE_P3_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 scripts/ci/p3-compose-physical-acceptance.py prepare
      - name: Run exact-source P3 Compose acceptance on the disposable hosted engine
        env:
          DEPLOYLITE_P3_DOCKER_INTEGRATION: '1'
          DEPLOYLITE_P3_DOCKER_RUNTIME_GRANT: P3_COMPOSE_CI_APPROVED
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_CONFIG: ${{ runner.temp }}/deploylite-p3-empty-docker-config
          DEPLOYLITE_P3_FIXTURE_MANIFEST: ${{ runner.temp }}/deploylite-p3-fixture-manifest.json
          DEPLOYLITE_P3_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          DEPLOYLITE_DB_INTEGRATION: '0'
          DEPLOYLITE_API_DB_INTEGRATION: '0'
        run: |
          set -Eeuo pipefail
          pnpm --filter @deploylite/api run test src/compose-resource-docker.integration.test.ts --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/deploylite-p3-evidence/docker.json" 2>&1 | tee "$RUNNER_TEMP/deploylite-p3-evidence/docker.log"
      - name: Require exact P3 case, receipts and resource cleanup
        if: always()
        env:
          DEPLOYLITE_P3_DOCKER_RUNTIME_GRANT: P3_COMPOSE_CI_APPROVED
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_CONFIG: ${{ runner.temp }}/deploylite-p3-empty-docker-config
          DEPLOYLITE_P3_FIXTURE_MANIFEST: ${{ runner.temp }}/deploylite-p3-fixture-manifest.json
          DEPLOYLITE_P3_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 scripts/ci/p3-compose-physical-acceptance.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: p3-docker-acceptance-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/deploylite-p3-evidence/
          if-no-files-found: warn
          retention-days: 30

  baseline-gate:
    if: always()
    needs: [quality, postgres-integration, compose-and-supply-chain, p2-docker-acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24.20.0 }
      - name: Collect pass evidence
        if: needs.quality.result == 'success' && needs.postgres-integration.result == 'success' && needs.compose-and-supply-chain.result == 'success' && needs.p2-docker-acceptance.result == 'success'
        run: |
          node scripts/ci/collect-evidence.mjs --output artifacts/baseline-evidence.json --commit "$GITHUB_SHA" --lock-hash "$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" --compose-digest "sha256:$(cat infra/vps/compose.yml infra/vps/compose.tls.yml | sha256sum | cut -d' ' -f1)" --image "deploylite-api:ci,${{ needs.compose-and-supply-chain.outputs.api_digest }},linux/amd64,$GITHUB_RUN_ID" --image "deploylite-web:ci,${{ needs.compose-and-supply-chain.outputs.web_digest }},linux/amd64,$GITHUB_RUN_ID" --check quality:pass --check postgres-integration:pass --check compose-and-supply-chain:pass --check p2-docker-acceptance:pass
      - name: Block incomplete or failing gates
        run: test "${{ needs.quality.result }}:${{ needs.postgres-integration.result }}:${{ needs.compose-and-supply-chain.result }}:${{ needs.p2-docker-acceptance.result }}" = "success:success:success:success"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: baseline-evidence, path: artifacts/baseline-evidence.json, if-no-files-found: warn, retention-days: 30 }
